<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nix module explorer</title>
<meta name="description" content="Browse and search NixOS, home-manager and nix-darwin module options, with docs and declaration sources.">
<meta property="og:site_name" content="Nix module explorer">
<meta property="og:title" content="Nix module explorer">
<meta property="og:description" content="Browse and search NixOS, home-manager and nix-darwin module options, with docs and declaration sources.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#5277c3">
<link rel="stylesheet" href="nix.css">
<!-- Before first paint, so a saved theme doesn't flash. Empty = follow the system. -->
<script>try { document.documentElement.style.colorScheme = localStorage.theme || ""; } catch {}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  /* Three columns, the outer two equal, so the search sits in the middle of the page. */
  header { display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: center; padding: .5rem 1rem; border-bottom: 1px solid #8884; }
  #search { width: min(20rem, 30vw); }
  .end { justify-self: end; display: flex; align-items: center; gap: .75rem; }
  .repo { display: flex; color: inherit; opacity: .7; }
  .repo:hover, .repo:focus-visible { opacity: 1; }
  button.repo { background: none; border: 0; padding: 0; cursor: pointer; }
  .clear { font-size: .8rem; font-weight: normal; margin-left: .5rem; text-decoration: underline; } /* h2 links are plain otherwise */
  /* --tree is set by dragging the divider. */
  main { display: grid; grid-template-columns: var(--tree, minmax(18rem, 30%)) auto 1fr; min-height: 0; }
  #split { width: 1px; background: #8884; cursor: col-resize; position: relative; touch-action: none; }
  #split::after { content: ""; position: absolute; inset: 0 -4px; } /* wider grab area than the line */
  #split:hover, #split:focus-visible { background: #888; outline: none; }
  nav, section { overflow: auto; padding: .5rem 1rem; }
  /* Details of the previous channel while the next one loads. */
  #detail.stale { opacity: .4; pointer-events: none; }
  nav { font-size: .9rem; font-family: ui-monospace, monospace; }
  details > :not(summary) { margin-left: 1rem; }
  /* Depth colours (cycle of 6), shared by tree names, indent guides and title segments. */
  .c0 { --c: light-dark(hsl(210 70% 40%), hsl(210 85% 72%)); }
  .c1 { --c: light-dark(hsl(145 60% 30%), hsl(145 55% 62%)); }
  .c2 { --c: light-dark(hsl(38 90% 35%), hsl(45 90% 62%)); }
  .c3 { --c: light-dark(hsl(10 70% 45%), hsl(12 85% 70%)); }
  .c4 { --c: light-dark(hsl(285 50% 45%), hsl(285 65% 75%)); }
  .c5 { --c: light-dark(hsl(185 70% 30%), hsl(185 60% 60%)); }
  .name { color: var(--c); }
  .md pre, dd pre { background: #8881; padding: .4rem .6rem; border-radius: .3rem; }
  /* Indent guides: each open folder draws a line in its own colour alongside its children. */
  details[open] { --g: color-mix(in srgb, var(--c) 60%, transparent);
    background: linear-gradient(var(--g), var(--g)) no-repeat .3rem 1.3em / 2px calc(100% - 1.3em); }
  summary, .leaf { cursor: pointer; padding: 1px 0; white-space: nowrap; }
  .leaf { display: block; color: inherit; text-decoration: none; }
  .leaf:hover, summary:hover, [aria-current] { background: #8883; }
  nav progress { display: block; width: 100%; margin-top: .4rem; }
  .count { opacity: .6; font-size: .8em; }
  .source { font-size: .7rem; padding: 0 .35rem; border: 1px solid #8886; border-radius: .25rem; margin-right: .4rem; vertical-align: middle; }
  /* Panel heading (group or search): a full-width tinted band, so it doesn't read like one more
     option heading. Negative margins cancel the section padding. */
  #detail > h2 { margin: -.5rem -1rem 0; padding: .6rem 1rem;
    font: 600 1.15rem ui-monospace, monospace; word-break: break-all;
    background: color-mix(in srgb, Canvas 90%, CanvasText); border-bottom: 1px solid #8884; }
  #detail > h2 .source { font-size: .75em; }
  #detail > h2 .note { font: .8rem system-ui, sans-serif; opacity: .7; margin-top: .2rem; }
  /* Line between the heading and the first option, like the lines between options. */
  #detail > :not(article):has(+ article) { border-bottom: 1px solid #8884; padding-bottom: .75rem; margin-bottom: 0; }
  article { border-bottom: 1px solid #8884; padding: .75rem 0; }
  article h3 { font-family: ui-monospace, monospace; font-size: .95rem; margin: 0 0 .25rem; word-break: break-all; }
  h2 a, h3 a { color: inherit; text-decoration: none; }
  h2 a:hover, h3 a:hover { text-decoration: underline; }
  .md { font-size: .9rem; line-height: 1.45; }
  .md p { margin: .4rem 0; }
  .md blockquote { margin: .5rem 0; padding: .1rem .75rem; border-left: 3px solid #d90; background: #d901; }
  pre { white-space: pre-wrap; margin: .25rem 0; font-size: .85rem; }
  code { font-size: .85em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .75rem; margin: .5rem 0 0; font-size: .85rem; }
  dt { opacity: .7; }
  dd { margin: 0; min-width: 0; }
  dd ul { margin: 0; padding-left: 1rem; }
  /* Phones: stack the tree above the details instead of side by side. */
  @media (max-width: 40rem) {
    body { height: 100dvh; }
    header { grid-template-columns: 1fr auto; padding: .5rem; }
    #search { grid-area: 2 / 1 / 3 / -1; width: 100%; font-size: 1rem; } /* 16px stops iOS zooming on focus */
    main { grid-template-columns: 1fr; grid-template-rows: var(--tree-h, 40%) auto 1fr; }
    #split { width: auto; height: 1px; cursor: row-resize; }
    #split::after { inset: -12px 0; } /* finger-sized grab area */
    nav, section { padding: .5rem; }
    #detail > h2 { margin: -.5rem -.5rem 0; padding: .5rem; }
    summary, .leaf { padding: .25rem 0; } /* bigger tap targets */
    dl { grid-template-columns: 1fr; }
    dd { margin-bottom: .4rem; }
  }
</style>
</head>
<body>
<header>
  <label>Channel <select id="channel"></select></label>
  <input id="search" type="search" placeholder="Fuzzy search options… (@nixos @home @darwin)" aria-label="Fuzzy search options">
  <!-- Inline SVG: the icon itself makes no request (offline site); only clicking leaves it. -->
  <div class="end">
  <button id="theme" class="repo" type="button" title="Toggle dark/light theme" aria-label="Toggle dark/light theme"><svg id="sun" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/></svg><svg id="moon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.2 1.2a6.5 6.5 0 1 0 8.6 8.6A5.5 5.5 0 0 1 6.2 1.2z"/></svg></button>
  <a class="repo" href="https://github.com/0xNoNames/nix-explorer" title="Source on GitHub" aria-label="Source on GitHub"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
</header>
<main>
  <nav id="tree" aria-label="Options">Loading…</nav>
  <div id="split" role="separator" aria-orientation="vertical" aria-label="Resize the tree" tabindex="0"></div>
  <section id="detail" aria-live="polite"><p>Select an option, or search.</p></section>
</main>
<script type="module">
import { marked } from "./marked.js";
import { buildTree, countOptions, esc, fuzzyScore, nixHTML, optionName, optionPath, parseSearch, preprocessMd } from "./lib.js";

const SOURCES = ["nixos", "home-manager", "darwin"];
const $ = (id) => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.filter((k) => k != null)); return e; };

// Descriptions come from upstream repos: escape raw HTML and drop non-http(s) links.
const nixCode = (src) => h("pre", {}, h("code", { innerHTML: nixHTML(src) }));
marked.use({
  renderer: {
    html: ({ text }) => esc(text),
    link(t) { return /^(https?:|mailto:|#)/i.test(t.href) ? false : this.parser.parseInline(t.tokens); },
    image: ({ text }) => esc(text), // an <img> would fetch from outside the site
    code: ({ text, lang }) => (lang === "nix" ? `<pre><code>${nixHTML(text)}</code></pre>` : false),
  },
});
const md = (text, source) => h("div", { className: "md", innerHTML: marked.parse(preprocessMd(text, source)) });

// Defaults/examples are { _type: "literalExpression" | "literalMD", text }.
const literal = (v, source) =>
  v == null ? null
  : v._type === "literalMD" ? md(v.text, source)
  : v._type === "literalExpression" ? nixCode(v.text)
  : h("pre", {}, h("code", {}, JSON.stringify(v, null, 2)));

let root, channelName, revs, allOptions = [], byKey = new Map(), current;
const els = new WeakMap(); // tree node -> its <details> or leaf <a>

// Tree paths are [source, ...loc]; URLs write them as Nix does: #nixos:boot.kernel.sysctl."net.core.rmem_max".
const href = (path) => "#" + path[0] + (path.length > 1 ? ":" + optionName(path.slice(1)) : "");

let loading = 0; // only the latest load() may write: an older one can finish after a quick channel switch
async function load(channel) {
  const seq = ++loading;
  $("detail").classList.add("stale");
  // Sizes come from the build: a compressing host's Content-Length doesn't match the decoded bytes counted here.
  const total = SOURCES.reduce((t, s) => t + channel.sizes[s], 0);
  const bar = h("progress", { max: total, value: 0 });
  bar.setAttribute("aria-label", `Loading ${channel.name}`);
  const stats = h("div", { className: "count" });
  $("tree").replaceChildren(`Loading ${channel.name}…`, bar, stats);
  let got = 0;
  const start = performance.now();
  const mb = (n) => `${(n / 1e6).toFixed(1)} MB`;
  let data;
  try {
    data = await Promise.all(SOURCES.map((s) => fetch(`data/${channel.name}/${s}.json`).then((r) => {
      if (!r.ok) throw new Error(`${r.url}: HTTP ${r.status}`);
      return new Response(r.body.pipeThrough(new TransformStream({ transform(chunk, c) {
        got += chunk.length;
        bar.value = got;
        const secs = (performance.now() - start) / 1000;
        stats.textContent = `${Math.floor(100 * got / total)}% · ${mb(got)} / ${mb(total)}${secs > 0 ? ` · ${mb(got / secs)}/s` : ""}`;
        c.enqueue(chunk);
      } }))).json();
    })));
  } catch (e) {
    if (seq === loading) $("tree").textContent = `Could not load ${channel.name}: ${e.message}`;
    return;
  }
  if (seq !== loading) return;
  root = buildTree(Object.fromEntries(SOURCES.map((s, i) => [s, data[i]])));
  channelName = channel.name;
  revs = { nixos: channel.nixpkgs.rev, "home-manager": channel["home-manager"].rev, darwin: channel["nix-darwin"].rev };
  allOptions = SOURCES.flatMap((s) => collect(root.children[s]));
  for (const o of allOptions) o.key = o.name.toLowerCase();
  byKey = new Map(allOptions.map((o) => [`${o.source}:${o.name}`, o]));
  $("tree").replaceChildren(...SOURCES.map((s) => renderNode(root.children[s], [s])));
  if ($("search").value) search(); else route();
  $("detail").classList.remove("stale");
}

const collect = (n) => [...(n.option ? [n.option] : []), ...Object.values(n.children).flatMap(collect)];
// "<imports = [ … ]>" segments (NixOS modular services) go after regular names.
const sortedKids = (n) => Object.values(n.children).sort((a, b) =>
  a.name.startsWith("<") - b.name.startsWith("<") || a.name.localeCompare(b.name));

// Dotted segments are quoted, as in Nix: boot.kernel.sysctl."net.core.rmem_max".
// Modular service keys (pkgs.X.services.Y) are import paths, not attribute names: left unquoted.
const seg = (s) => (s.includes(".") && !s.startsWith("pkgs.") ? `"${s}"` : s);

// Name segment coloured by its depth in the tree (source = 0).
const name = (text, depth) => h("span", { className: `name c${depth % 6}` }, text);

// How a modular service option is actually set.
const modularUsage = (o) => {
  const rest = o.loc.slice(2).map(seg).join(".");
  return `system.services.<name> = {\n  imports = [ ${o.modular} ];${rest ? `\n  ${rest} = …;` : ""}\n};`;
};

function renderNode(node, path) {
  // A chain of groups ending in a single option collapses into one leaf: appstream -> enable => "appstream.enable".
  const chain = [node];
  let leafPath = path;
  for (let n = node; !n.option && Object.keys(n.children).length === 1; ) {
    n = Object.values(n.children)[0];
    chain.push(n);
    leafPath = [...leafPath, n.name];
  }
  if (!Object.keys(chain.at(-1).children).length) {
    const depth = path.length - 1;
    const a = h("a", { className: "leaf", href: href(leafPath) },
      ...chain.flatMap((n, j) => [j ? "." : null, name(seg(n.name), depth + j)]));
    for (const n of chain) els.set(n, a); // routes to any merged node land on this leaf
    return a;
  }
  const kids = sortedKids(node);
  // Sources show their pinned revision, short like git; the full one in the tooltip (no GitHub links: offline site).
  const rev = path.length === 1 && revs[node.name];
  const summary = h("summary", {}, name(node.name, path.length - 1), " ", h("span", { className: "count" }, String(countOptions(node))),
    rev ? h("span", { className: "count", title: rev }, ` @ ${rev.slice(0, 7)}`) : null);
  summary.addEventListener("click", () => { location.hash = href(path); });
  const d = h("details", { className: `c${(path.length - 1) % 6}` }, summary);
  // Render children on first open; the full tree is tens of thousands of nodes.
  d.renderKids = () => { if (d.childElementCount === 1) d.append(...kids.map((k) => renderNode(k, [...path, k.name]))); };
  d.addEventListener("toggle", () => d.open && d.renderKids());
  els.set(node, d);
  return d;
}

// Breadcrumb title: every segment links to its node in the tree.
const crumbs = (path) => [
  h("a", { className: "source", href: href(path.slice(0, 1)) }, name(path[0], 0)),
  ...path.slice(1).flatMap((s, i) => [i ? "." : null, h("a", { href: href(path.slice(0, i + 2)) }, name(seg(s), i + 1))]),
];

function show(title, options, note) {
  $("detail").replaceChildren(...(title ? [h("h2", {}, ...[title].flat(), note ? h("div", { className: "note" }, note) : null)] : []),
    ...options.map(renderOption));
  $("detail").scrollTop = 0;
}

// Reveal a node in the tree (open its ancestors), select it, and show it.
function showPath(path) {
  let node = root, el = null;
  for (const seg of path) {
    node = node.children[seg];
    if (!node) return $("detail").replaceChildren(h("p", {}, `“${optionName(path.slice(1))}” is not in ${path[0]} on ${channelName}.`));
    if (el?.renderKids) { el.renderKids(); el.open = true; } // merged leaves have no kids to open
    el = els.get(node);
  }
  current?.removeAttribute("aria-current");
  current = el.tagName === "DETAILS" ? el.firstChild : el;
  current.setAttribute("aria-current", "true");
  current.scrollIntoView({ block: "nearest" });

  const kids = sortedKids(node);
  if (!kids.length) return show(null, [node.option]);
  const opts = [node.option, ...kids.map((k) => k.option)].filter(Boolean);
  const total = countOptions(node);
  if (opts.length) show(crumbs(path), opts,
    `${opts.length} option${opts.length > 1 ? "s" : ""} directly here, ${total} in total. Expand the tree for the rest.`);
  else show(crumbs(path), [], `${total} options below. Expand the tree to browse.`);
}

function renderOption(o) {
  const row = (k, v) => (v == null ? [] : [h("dt", {}, k), h("dd", {}, v)]);
  return h("article", {},
    h("h3", {}, ...crumbs([o.source, ...o.loc])),
    o.description ? md(o.description, o.source) : null,
    h("dl", {},
      ...row("Usage", o.modular ? nixCode(modularUsage(o)) : null),
      ...row("Type", o.type),
      ...row("Default", literal(o.default, o.source)),
      ...row("Example", literal(o.example, o.source)),
      ...row("Read-only", o.readOnly ? "yes" : null),
      ...row("Declared in", o.decls.length ? h("ul", {}, ...o.decls.map((d) =>
        h("li", {}, h("a", { href: `source.html?${channelName}/${d}#${o.source}:${o.name}` }, d)))) : null)));
}

function search() {
  const { q, sources } = parseSearch($("search").value, SOURCES);
  if (!q) return route(); // cleared: back to what the URL shows
  const hits = [];
  for (const o of allOptions) {
    if (sources && !sources.includes(o.source)) continue;
    const s = fuzzyScore(q, o.key); if (s >= 0) hits.push([s, o]);
  }
  hits.sort((a, b) => b[0] - a[0]);
  const clear = h("a", { href: "", className: "clear" }, "clear");
  clear.addEventListener("click", (e) => { e.preventDefault(); $("search").value = ""; search(); });
  show([`Results for “${q}” (${hits.length > 200 ? `top 200 of ${hits.length}` : hits.length})`, clear],
    hits.slice(0, 200).map((x) => x[1]));
}

// Hash: "#<source>" or "#<source>:<dotted option or group name>".
function route() {
  let hash;
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch { return; }
  const m = hash.match(/^([\w-]+)(?::([\s\S]*))?$/);
  if (!m) return $("detail").replaceChildren(h("p", {}, "Select an option, or search."));
  const [, source, name = ""] = m;
  // Own source first: exact option name, then tree path (groups, modular services). Only then other
  // sources' exact names, for {option} doc links into another source (home-manager text naming a NixOS option).
  const own = name && byKey.get(`${source}:${name}`);
  if (own) return showPath([own.source, ...own.loc]);
  const path = [source, ...optionPath(name)];
  if (path.reduce((n, seg) => n?.children[seg], root)) return showPath(path);
  const other = name && SOURCES.map((s) => byKey.get(`${s}:${name}`)).find(Boolean);
  showPath(other ? [other.source, ...other.loc] : path);
}

$("search").addEventListener("input", search);

// Theme: the head script applies the saved choice on both pages (none saved = follow the system).
// The button shows the theme a click switches to (moon in light mode, sun in dark) and saves it.
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.style.colorScheme || (systemDark.matches ? "dark" : "light")) === "dark";
const themeIcon = () => { $("sun").style.display = isDark() ? "" : "none"; $("moon").style.display = isDark() ? "none" : ""; };
$("theme").addEventListener("click", () => {
  document.documentElement.style.colorScheme = isDark() ? "light" : "dark";
  try { localStorage.theme = document.documentElement.style.colorScheme; } catch { /* storage blocked: choice lasts for this page only */ }
  themeIcon();
});
systemDark.addEventListener("change", themeIcon);
themeIcon();

// Divider between tree and details: drag it, or focus it and use the arrow keys. Side by side it sets the
// tree's width; stacked (phones, same breakpoint as the CSS) its height. Each is remembered separately.
const main = document.querySelector("main");
const stacked = matchMedia("(max-width: 40rem)");
const orient = () => $("split").setAttribute("aria-orientation", stacked.matches ? "horizontal" : "vertical");
stacked.addEventListener("change", orient);
orient();
function setTree(px, tall = stacked.matches) {
  const room = tall ? main.clientHeight : innerWidth;
  px = Math.round(Math.min(Math.max(px, tall ? 80 : 160), room - (tall ? 120 : 240)));
  main.style.setProperty(tall ? "--tree-h" : "--tree", `${px}px`);
  try { localStorage[tall ? "treeHeight" : "treeWidth"] = px; } catch { /* storage blocked: size just isn't remembered */ }
}
try {
  if (localStorage.treeWidth) setTree(+localStorage.treeWidth, false);
  if (localStorage.treeHeight) setTree(+localStorage.treeHeight, true);
} catch { /* storage blocked */ }
$("split").addEventListener("pointerdown", (e) => { e.preventDefault(); $("split").setPointerCapture(e.pointerId); });
$("split").addEventListener("pointermove", (e) => {
  if ($("split").hasPointerCapture(e.pointerId))
    setTree(stacked.matches ? e.clientY - main.getBoundingClientRect().top : e.clientX);
});
$("split").addEventListener("keydown", (e) => {
  const step = (stacked.matches ? { ArrowUp: -20, ArrowDown: 20 } : { ArrowLeft: -20, ArrowRight: 20 })[e.key];
  if (step) { e.preventDefault(); setTree((stacked.matches ? $("tree").offsetHeight : $("tree").offsetWidth) + step); }
});
// Navigating (tree, links, back) replaces search results, so clear the box to match the panel.
addEventListener("hashchange", () => { $("search").value = ""; route(); });

const channels = await fetch("data/channels.json").then((r) => r.json());
$("channel").append(...channels.map((c, i) => h("option", { value: i }, `${c.name} (${c.status})`)));
// Channel is the whole query string (?nixos-26.05) so shared links keep it; in-page #links preserve it.
function selectChannel(i) {
  $("channel").value = i;
  history.replaceState(null, "", `?${channels[i].name}${location.hash}`);
  load(channels[i]);
}
$("channel").addEventListener("change", (e) => selectChannel(+e.target.value));
let wanted = "";
try { wanted = decodeURIComponent(location.search.slice(1)); } catch { /* malformed: default channel */ }
// Default: the newest stable release (channels are newest first), else the first channel.
const fallback = Math.max(0, channels.findIndex((c) => c.status === "stable"));
const asked = channels.findIndex((c) => c.name === wanted);
selectChannel(asked >= 0 ? asked : fallback);
</script>
</body>
</html>
